<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dove Nest | Authentic Goan Stay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Smooth Scroll Architecture Hook -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    <link rel="stylesheet" href="frontend/css/style.css">
    <script src="frontend/js/main.js" defer></script>
</head>
<body class="antialiased selection:bg-[var(--color-primary)] selection:text-white">

    <nav class="sticky top-0 z-50 bg-[var(--color-bg)]/80 backdrop-blur-xl border-b border-[var(--color-nav-border)]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="text-2xl font-black text-[var(--color-primary)] tracking-tighter">
                    🕊️ Dove Nest
                </a>
                
                <div class="hidden md:flex items-center space-x-10 text-sm font-medium tracking-wide">
                    <a href="index.html" class="text-[var(--color-primary)] border-b-2 border-[var(--color-primary)] pb-1">Home</a>
                    <a href="frontend/gallery.html" class="hover:text-[var(--color-primary)] transition-colors">Gallery</a>
                    <a href="frontend/availability.html" class="hover:text-[var(--color-primary)] transition-colors">Availability</a>
                    <a href="frontend/contact.html" class="hover:text-[var(--color-primary)] transition-colors">Find Us</a>
                    <a href="frontend/booking.html" class="px-6 py-3 rounded-full bg-[var(--color-primary)] text-white hover:bg-[var(--color-secondary)] transition-all shadow-md">Book Now</a>
                    <button id="theme-toggle" class="p-2 rounded-full hover:bg-[var(--color-nav-border)] transition-colors">🌓</button>
                </div>
            </div>
        </div>
    </nav>

    <header class="relative overflow-hidden pt-20 pb-32 lg:pt-28 lg:pb-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col-reverse lg:flex-row items-center gap-16">
            
            <div class="flex-1 text-center lg:text-left animate-fade-in">
                <span class="text-[var(--color-primary)] font-bold tracking-widest uppercase text-xs mb-4 block">Welcome to Santa Cruz</span>
                <h1 class="text-5xl md:text-6xl lg:text-7xl font-extrabold tracking-tight leading-none mb-6 text-[var(--color-text)]">
                    Experience Pure <br>
                    <span class="text-[var(--color-primary)]">Goan Susegad.</span>
                </h1>
                <p class="text-lg opacity-80 mb-10 max-w-xl mx-auto lg:mx-0 font-light leading-relaxed">
                    Escape to a rustic, Portuguese-style paradise nestled in lush palm groves. Perfect for destination weddings, weekend getaways, and private celebrations.
                </p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
                    <a href="frontend/booking.html" class="px-8 py-4 font-bold rounded-xl text-white bg-[var(--color-primary)] hover:bg-[var(--color-secondary)] shadow-lg transition-all">
                        Check Availability
                    </a>
                    <a href="frontend/gallery.html" class="px-8 py-4 font-bold rounded-xl border-2 border-[var(--color-primary)] text-[var(--color-primary)] hover:bg-[var(--color-primary)] hover:text-white transition-all">
                        View Gallery
                    </a>
                </div>
            </div>

            <div class="flex-1 w-full">
                <div class="rounded-[2rem] overflow-hidden shadow-2xl h-[400px] lg:h-[500px] bg-[var(--color-nav-border)]">
                    <!-- Placeholder ready: will smoothly transition into view -->
                    <img src="https://images.unsplash.com/photo-1582647509711-c8aa8a8bda71?auto=format&fit=crop&w=800&q=80" alt="Goan Villa" class="object-cover w-full h-full coastal-image-mask observer-trigger">
                </div>
            </div>
        </div>
    </header>
</body>
</html>
