<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availability | Dove Nest Goa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body class="antialiased">

    <!-- Global Navigation System -->
    <nav class="sticky top-0 z-50 bg-[var(--color-bg)]/80 backdrop-blur-xl border-b border-[var(--color-nav-border)]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="../index.html" class="text-2xl font-black text-[var(--color-primary)] tracking-tighter">🕊️ Dove Nest</a>
                <div class="hidden md:flex items-center space-x-10 text-sm font-medium tracking-wide">
                    <a href="../index.html" class="hover:text-[var(--color-primary)] transition-colors">Home</a>
                    <a href="gallery.html" class="hover:text-[var(--color-primary)] transition-colors">Gallery</a>
                    <a href="availability.html" class="text-[var(--color-primary)] border-b-2 border-[var(--color-primary)] pb-1">Availability</a>
                    <a href="feedback.html" class="hover:text-[var(--color-primary)] transition-colors">Reviews</a>
                    <a href="contact.html" class="hover:text-[var(--color-primary)] transition-colors">Find Us</a>
                    <a href="booking.html" class="px-6 py-3 rounded-full bg-[var(--color-primary)] text-white hover:bg-[var(--color-secondary)] transition-all shadow-md">Book Now</a>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Calendar Engine Layout -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-20">
        <h1 class="text-5xl font-extrabold tracking-tight text-center mb-4">Live Venue Schedule</h1>
        <p class="text-center opacity-70 mb-16 font-light max-w-md mx-auto">See our upcoming schedule below. To reserve an available date, use our WhatsApp booking form.</p>
        
        <!-- Live Calendar Grid -->
        <div id="calendar-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-6">
            <!-- Dynamic calendar tiles generate here automatically -->
        </div>
    </main>

    <script>
        // ==========================================
        //  MANUAL BOOKING REGISTRY (EDIT ON GITHUB)
        // ==========================================
        // Simply add or remove dates below using the exact format: "YYYY-MM-DD"
        const BOOKED_DATES = [
            "2026-05-25",
            "2026-06-05",
            "2026-06-12",
            "2026-06-20",
            "2026-06-21"
        ];

        function buildManualCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = ''; 
            
            // Generates a rolling 28-day schedule starting from today
            for(let i = 0; i < 28; i++) {
                let d = new Date();
                d.setDate(d.getDate() + i);
                
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const dateString = `${year}-${month}-${day}`;
                
                // Cross-reference our manual array above
                const isBooked = BOOKED_DATES.includes(dateString);
                
                const uiClass = isBooked 
                    ? 'bg-rose-500/5 border-rose-500/20 text-rose-600 dark:text-rose-400 font-medium' 
                    : 'bg-blue-500/5 border-blue-500/20 text-[var(--color-primary)]';
                    
                const label = isBooked ? '🔒 Reserved' : '✅ Available';
                
                const card = `
                    <div class="border p-6 rounded-2xl flex flex-col items-center justify-center text-center bg-[var(--color-card)] shadow-sm ${uiClass} animate-fade-in" style="animation-delay: ${i * 0.015}s">
                        <span class="text-xs uppercase font-bold tracking-widest opacity-60">${d.toLocaleString('default', { month: 'short' })}</span>
                        <span class="text-3xl font-black my-1">${day}</span>
                        <span class="text-xs font-bold mt-2 px-3 py-1 bg-[var(--color-bg)] rounded-full border border-[var(--color-nav-border)] w-full">${label}</span>
                    </div>
                `;
                grid.innerHTML += card;
            }
        }

        // Run calendar execution on mount
        buildManualCalendar();
    </script>
</body>
</html>
