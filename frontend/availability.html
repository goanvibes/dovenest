<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availability | Dove Nest Goa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js"></script>
</head>
<body class="antialiased">

    <!-- Nav (Truncated for brevity, use same as previous pages) -->
    
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-12">
        <h1 class="text-4xl font-extrabold tracking-tight text-center mb-10">Live Venue Schedule</h1>
        
        <!-- Live Calendar Grid generated by JS -->
        <div id="calendar-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4">
            <!-- Injecting skeleton loaders for UX -->
            <div class="col-span-full text-center py-10 animate-pulse">Loading live API data...</div>
        </div>
    </main>

    <script>
        async function buildCalendar() {
            try {
                // Fetch from the local Python API
                const res = await fetch('http://127.0.0.1:5000/api/availability');
                const bookedData = await res.json();
                
                const grid = document.getElementById('calendar-grid');
                grid.innerHTML = ''; // Clear loader
                
                // Generate next 28 days
                for(let i = 0; i < 28; i++) {
                    let d = new Date();
                    d.setDate(d.getDate() + i);
                    
                    // Format YYYY-MM-DD cleanly based on local time
                    const year = d.getFullYear();
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    const dateString = `${year}-${month}-${day}`;
                    
                    // Check intersection with backend data
                    const isBooked = bookedData.find(b => b.date === dateString);
                    
                    const uiClass = isBooked 
                        ? 'bg-rose-500/10 border-rose-500/30 text-rose-600 dark:text-rose-400' 
                        : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-600 dark:text-emerald-400';
                        
                    const label = isBooked ? '🔒 Booked' : '✅ Available';
                    
                    // UI Card Construct
                    const card = `
                        <div class="border p-4 rounded-xl flex flex-col items-center justify-center text-center shadow-sm ${uiClass} animate-fade-in" style="animation-delay: ${i * 0.02}s">
                            <span class="text-xs uppercase font-bold tracking-widest opacity-70">${d.toLocaleString('default', { month: 'short' })}</span>
                            <span class="text-2xl font-black">${day}</span>
                            <span class="text-xs font-semibold mt-2 px-2 py-1 bg-[var(--color-card)] rounded-md shadow-sm w-full">${label}</span>
                        </div>
                    `;
                    grid.innerHTML += card;
                }
            } catch (error) {
                document.getElementById('calendar-grid').innerHTML = `<div class="col-span-full text-red-500 text-center font-bold py-10">Cannot connect to the backend server. Ensure Python is running!</div>`;
            }
        }

        buildCalendar();
    </script>
</body>
</html>
