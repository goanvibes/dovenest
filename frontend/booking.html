<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now | Dove Nest Goa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body class="antialiased">

    <!-- Global Navigation -->
    <nav class="sticky top-0 z-50 bg-[var(--color-bg)]/80 backdrop-blur-xl border-b border-[var(--color-nav-border)]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="../index.html" class="text-2xl font-black text-[var(--color-primary)] tracking-tighter">🕊️ Dove Nest</a>
                <div class="hidden md:flex items-center space-x-10 text-sm font-medium tracking-wide">
                    <a href="../index.html" class="hover:text-[var(--color-primary)] transition-colors">Home</a>
                    <a href="gallery.html" class="hover:text-[var(--color-primary)] transition-colors">Gallery</a>
                    <a href="availability.html" class="hover:text-[var(--color-primary)] transition-colors">Availability</a>
                    <a href="feedback.html" class="hover:text-[var(--color-primary)] transition-colors">Reviews</a>
                    <a href="contact.html" class="hover:text-[var(--color-primary)] transition-colors">Find Us</a>
                    <a href="booking.html" class="px-6 py-3 rounded-full bg-[var(--color-primary)] text-white hover:bg-[var(--color-secondary)] transition-all shadow-md">Book Now</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-20 animate-fade-in">
        <div class="text-center mb-12">
            <h1 class="text-5xl font-extrabold tracking-tight mb-4">Secure Your Oasis</h1>
            <p class="opacity-70 font-light text-lg">Submit details directly to dispatch confirmation metrics via instant messaging gateways.</p>
        </div>

        <form id="whatsapp-booking-form" class="bg-[var(--color-card)] p-8 md:p-12 rounded-3xl shadow-xl border border-[var(--color-nav-border)] space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold mb-2 opacity-80">Full Name</label>
                    <input type="text" id="b-name" required class="w-full p-4 rounded-xl border border-[var(--color-nav-border)] bg-transparent focus:border-[var(--color-primary)] outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2 opacity-80">Preferred Date</label>
                    <input type="date" id="b-date" required class="w-full p-4 rounded-xl border border-[var(--color-nav-border)] bg-[var(--color-card)] focus:border-[var(--color-primary)] outline-none transition-all">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold mb-2 opacity-80">Type of Gathering</label>
                <select id="b-event" class="w-full p-4 rounded-xl border border-[var(--color-nav-border)] bg-[var(--color-card)] focus:border-[var(--color-primary)] outline-none">
                    <option value="Pool Party / Sundowner">Pool Party / Sundowner</option>
                    <option value="Intimate Wedding">Intimate Wedding</option>
                    <option value="Family Staycation">Family Staycation</option>
                    <option value="Corporate Retreat">Corporate Retreat</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold mb-2 opacity-80">Guest Count</label>
                <input type="number" id="b-guests" min="1" max="150" required placeholder="e.g., 25" class="w-full p-4 rounded-xl border border-[var(--color-nav-border)] bg-transparent focus:border-[var(--color-primary)] outline-none">
            </div>

            <button type="submit" class="w-full py-4 rounded-xl font-bold text-lg bg-[#25D366] text-white hover:bg-[#1DA851] shadow-lg hover:-translate-y-0.5 transition-all flex justify-center items-center gap-2">
                Send Request via WhatsApp
            </button>
        </form>
    </main>

    <script src="js/booking.js"></script>
</body>
</html>
