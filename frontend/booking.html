<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now | Dove Nest Goa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js"></script>
</head>
<body class="antialiased">

    <!-- Navigation Bar -->
    <nav class="sticky top-0 z-50 bg-[var(--color-card)] shadow-sm border-b border-[var(--color-nav-border)] backdrop-blur-md bg-opacity-90">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="../index.html" class="text-2xl font-black text-[var(--color-primary)] tracking-tight">🕊️ Dove Nest</a>
                <div class="hidden md:flex items-center space-x-8 font-medium">
                    <a href="../index.html" class="hover:text-[var(--color-secondary)] transition-colors py-1">Home</a>
                    <a href="gallery.html" class="hover:text-[var(--color-secondary)] transition-colors py-1">Gallery</a>
                    <a href="availability.html" class="hover:text-[var(--color-secondary)] transition-colors py-1">Availability</a>
                    <a href="feedback.html" class="hover:text-[var(--color-secondary)] transition-colors py-1">Reviews</a>
                    <a href="contact.html" class="hover:text-[var(--color-secondary)] transition-colors py-1">Find Us</a>
                    <a href="booking.html" class="px-5 py-2 rounded-full bg-[var(--color-primary)] text-white shadow-md">Book Now</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-12 animate-fade-in">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight mb-4">Secure Your Oasis</h1>
            <p class="opacity-70">Fill out your requirements below. We will instantly connect you with our booking manager via WhatsApp to confirm details and finalize your stay in Santa Cruz.</p>
        </div>

        <form id="whatsapp-booking-form" class="bg-[var(--color-card)] p-8 rounded-2xl shadow-xl border border-[var(--color-nav-border)] space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold mb-2">Full Name</label>
                    <input type="text" id="b-name" required class="w-full p-3 rounded-lg border border-[var(--color-nav-border)] bg-transparent focus:ring-2 focus:ring-[var(--color-primary)] outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-2">Preferred Date</label>
                    <input type="date" id="b-date" required class="w-full p-3 rounded-lg border border-[var(--color-nav-border)] bg-[var(--color-card)] focus:ring-2 focus:ring-[var(--color-primary)] outline-none transition-all">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold mb-2">Type of Gathering</label>
                <select id="b-event" class="w-full p-3 rounded-lg border border-[var(--color-nav-border)] bg-[var(--color-card)] focus:ring-2 focus:ring-[var(--color-primary)] outline-none">
                    <option value="Pool Party / Sundowner">Pool Party / Sundowner</option>
                    <option value="Intimate Wedding">Intimate Wedding</option>
                    <option value="Family Staycation">Family Staycation</option>
                    <option value="Corporate Retreat">Corporate Retreat</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold mb-2">Guest Count</label>
                <input type="number" id="b-guests" min="1" max="150" required placeholder="e.g., 25" class="w-full p-3 rounded-lg border border-[var(--color-nav-border)] bg-transparent focus:ring-2 focus:ring-[var(--color-primary)] outline-none">
            </div>

            <button type="submit" class="w-full py-4 rounded-xl font-bold text-lg bg-[#25D366] text-white hover:bg-[#1DA851] shadow-lg hover:-translate-y-1 transition-all duration-300 flex justify-center items-center gap-2">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                Send Request via WhatsApp
            </button>
        </form>
    </main>

    <script src="js/booking.js"></script>
</body>
</html>
